name: APK derle

on:
  push:
    branches: [main]
    paths-ignore: ["data/fuel.json", "README.md", ".github/workflows/test-tolls.yml", ".github/workflows/kgm-dump.yml", ".github/workflows/osm-dump.yml", "scripts/test-tolls.mjs"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Bağımlılıklar
        run: npm install --no-audit --no-fund

      - name: Leaflet ve fiyat verisini kopyala
        run: npm run vendor

      - name: Android projesi
        run: npx cap add android

      - name: Konum izni ekle
        run: |
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          grep -n "permission" android/app/src/main/AndroidManifest.xml

      - name: Web dosyalarını eşitle
        run: npx cap sync android

      - name: Sabit imza anahtarı (güncellemeler eskisinin üzerine kurulsun)
        run: |
          mkdir -p ~/.android
          cp keystore/debug.keystore ~/.android/debug.keystore

      - name: APK derle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK'yı adlandır
        run: cp android/app/build/outputs/apk/debug/app-debug.apk yol-maliyeti.apk

      - uses: actions/upload-artifact@v4
        with:
          name: yol-maliyeti-apk
          path: yol-maliyeti.apk

      - name: Sürüm yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Yol Maliyeti v1.0.${{ github.run_number }}
          body: Telefona indirip kurun. İlk kurulumda "Bilinmeyen kaynaklardan yükleme" iznini vermeniz gerekir.
          files: yol-maliyeti.apk
          make_latest: true
