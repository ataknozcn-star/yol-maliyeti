name: Yakıt fiyatlarını güncelle

on:
  schedule:
    - cron: "30 3 * * *"   # her gün 06:30 (Türkiye saati)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Petrol Ofisi il fiyatlarını çek
        run: node scripts/update-fuel.mjs
      - name: Değiştiyse kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fuel.json
          git diff --cached --quiet || (git commit -m "Yakıt fiyatları güncellendi" && git push)
